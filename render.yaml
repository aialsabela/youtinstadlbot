services:
  - type: web
    name: yt-instagram-bot
    env: python
    buildCommand: "pip install -r requirements.txt && pip install --upgrade --no-cache-dir yt-dlp && apt-get update && apt-get install -y ffmpeg"
    startCommand: "python bot.py"
    envVars:
      - key: BOT_TOKEN
        sync: false
    autoDeploy: true
